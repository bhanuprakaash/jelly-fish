name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jellyfish
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: jellyfish
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://jellyfish:changeme@localhost:5432/jellyfish?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: bhanuprakaash
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(make test),Bash(make lint),Bash(make fmt),Bash(go test:*),Bash(go vet:*),Bash(go build:*),Bash(pnpm --dir web install --frozen-lockfile),Bash(pnpm --dir web build),Bash(pnpm --dir web lint),Bash(pnpm --dir web exec tsc:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git checkout:*),Bash(git push:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*)"
            --disallowedTools "Bash(go mod tidy:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push origin main:*)"
