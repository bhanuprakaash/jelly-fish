name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against:
            - AGENTS.md and docs/style.md, especially the Comments section.
            - The acceptance criteria of every issue the PR closes (`Closes #N`): read each with `gh issue view`.
            - Any docs/design spec those issues link.

            Focus on:
            - Correctness.
            - Missing or weak tests.
            - Needless layers, options or code that could be deleted.
            - Comments that narrate instead of stating a constraint.
            - Drift from the spec.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific lines.
            Then post one short summary with `gh pr comment`.
            Do not restate the diff. If there is nothing to flag, say so plainly.

            The PR branch is already checked out in the current working directory.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Grep,Glob"
