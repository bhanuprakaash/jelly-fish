      containers:
        - name: worker
          image: localhost:5000/jelly-fish:latest
          imagePullPolicy: Always
          args: ["worker"]
          ports:
            - name: health
              containerPort: 9090
          envFrom:
            - secretRef:
                name: postgres-secrets
          env:
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
