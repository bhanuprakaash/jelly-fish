apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jelly-fish
resources:
  - namespace.yaml
  - postgres.yaml
  - minio.yaml
  - mailpit.yaml
  - app.yaml
secretGenerator:
  - name: postgres-secrets
    envs:
      - .env.postgres
  - name: app-secrets
    envs:
      - .env.app
  - name: minio-secrets
    envs:
      - .env.minio
