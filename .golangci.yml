version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - godot
    - noctx
    - revive
  exclusions:
    rules:
      - linters: [revive]
        text: unused-parameter
      - path: _test\.go
        linters: [noctx]

formatters:
  enable:
    - gofmt
    - goimports
