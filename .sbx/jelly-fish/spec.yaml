schemaVersion: "2"
kind: mixin
name: jelly-fish
description: Go, Node, pnpm, kubectl and a k3d cluster with a localhost:5001 registry, matching the host dev setup.

permissions:
  network:
    allow:
      - dl.google.com
      - go.dev
      - nodejs.org
      - dl.k8s.io
      - cdn.dl.k8s.io
      - raw.githubusercontent.com
      - github.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      - cgr.dev
      - "*.r2.cloudflarestorage.com"

environment:
  variables:
    DATABASE_URL: postgres://jellyfish:changeme@localhost:5433/jellyfish?sslmode=disable
    TEST_DATABASE_URL: postgres://jellyfish:changeme@localhost:5433/jellyfish?sslmode=disable
    CGO_ENABLED: "1"

setup:
  install:
    - description: C toolchain for go test -race
      command: apt-get update -qq && apt-get install -y -qq gcc libc6-dev
    - description: Go 1.25.6 (go.mod)
      command: |
        set -e
        arch=$(dpkg --print-architecture)
        rm -rf /usr/local/go
        curl -fsSL "https://dl.google.com/go/go1.25.6.linux-${arch}.tar.gz" | tar -C /usr/local -xz
    - description: Node 22 + pnpm 12.6.0 (CI)
      command: |
        set -e
        arch=$(dpkg --print-architecture); [ "$arch" = amd64 ] && arch=x64
        v=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | grep -o "node-v22[^ ]*-linux-${arch}.tar.gz" | head -1)
        rm -rf /usr/local/node && mkdir -p /usr/local/node
        curl -fsSL "https://nodejs.org/dist/latest-v22.x/${v}" | tar -C /usr/local/node --strip-components=1 -xz
        /usr/local/node/bin/npm install -g pnpm@12.6.0
    - description: kubectl + k3d
      command: |
        set -e
        arch=$(dpkg --print-architecture)
        curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/${arch}/kubectl"
        chmod +x /usr/local/bin/kubectl
        curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | USE_SUDO=false K3D_INSTALL_DIR=/usr/local/bin bash
    - description: PATH for Go and Node
      command: |
        echo 'export PATH=/usr/local/go/bin:/usr/local/node/bin:$HOME/go/bin:$PATH' >> /etc/sandbox-persistent.sh

  files:
    - path: /home/agent/.jelly-fish/registries.yaml
      content: |
        mirrors:
          "localhost:5001":
            endpoint:
              - http://k3d-jf-registry.localhost:5000
    - path: /home/agent/.jelly-fish/up.sh
      mode: "0755"
      content: |
        #!/bin/bash
        # Brings up the sandbox-local k3d cluster, registry and dev .env files. Idempotent.
        set -e
        cd "${WORKDIR}"
        for f in postgres minio; do
          [ -f "deploy/k8s/.env.$f" ] || cp "deploy/k8s/.env.$f.example" "deploy/k8s/.env.$f"
        done
        until docker info >/dev/null 2>&1; do sleep 1; done
        k3d registry list jf-registry.localhost >/dev/null 2>&1 || k3d registry create jf-registry.localhost --port 5001
        if ! k3d cluster list jf >/dev/null 2>&1; then
          # --api-port: 0.0.0.0 would route kubectl through the sandbox proxy.
          # /dev/kmsg: the sandbox has none and kubelet refuses to start without it.
          k3d cluster create jf --api-port 127.0.0.1:6550 --volume "/dev/null:/dev/kmsg@server:0" --registry-use k3d-jf-registry.localhost:5001 \
            --registry-config /home/agent/.jelly-fish/registries.yaml \
            --k3s-arg "--disable=traefik@server:0" --wait
        else
          k3d cluster start jf --wait
        fi
        echo "jelly-fish sandbox ready"

  startup:
    - description: k3d cluster + registry
      command: ["bash", "-c", "/home/agent/.jelly-fish/up.sh > /home/agent/.jelly-fish/up.log 2>&1"]
      background: true

agentInstructions:
  content: |
    # jelly-fish sandbox

    - Local k8s is a k3d cluster `jf` in this sandbox, with the image registry at `localhost:5001` (same as the host).
      It is started in the background at sandbox start; wait for `jelly-fish sandbox ready` in `~/.jelly-fish/up.log` (rerun `~/.jelly-fish/up.sh` if it failed).
    - `make infra deploy` works as on the host. `make db &` forwards postgres to `localhost:5433`; `DATABASE_URL` and `TEST_DATABASE_URL` already point there.
    - `.env.postgres` / `.env.minio` are copies of the committed examples (throwaway dev creds).
    - Not available here: Tailscale, `make serve`, phone checks. The user does those on the host.
    - Work on a branch and commit; the user fetches it from the host and pushes. Don't push.
